<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshots · WASD</title>
<meta name="description" content="What changed in each Minecraft Java snapshot and Bedrock preview, read from the game files.">
<link rel="stylesheet" href="../shared/shell.css">
<link rel="stylesheet" href="snapshots.css">
</head>
<body data-tool="snapshots">
<main>
  <header class="head">
    <h1>Snapshots</h1>
    <p>What changed in each Java snapshot and Bedrock preview, read straight from the game files. Each one has two views: this update, and everything since the last release.</p>
  </header>
  <nav class="seg" aria-label="Edition"><i class="seg-hl"></i>
    <a href="#java">Java</a>
    <a href="#bedrock">Bedrock</a>
  </nav>
  <div class="panel entries" id="entries"><i class="hl"></i></div>
</main>
<script src="../shared/shell.js"></script>
<script src="data.js"></script>
<script>
(() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
  const date = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const seg = document.querySelector('.seg'), shl = seg.querySelector('.seg-hl'), links = [...seg.querySelectorAll('a')];
  const list = document.getElementById('entries'), hl = list.querySelector('.hl');

  // Edition lives in the URL hash so pages can link straight to #bedrock.
  const show = (edition, instant) => {
    const ed = SNAPSHOTS[edition], a = links.find(x => x.hash === '#' + edition);
    links.forEach(x => x === a ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
    if (instant) shl.style.transition = 'none';
    shl.style.width = a.offsetWidth + 'px'; shl.style.transform = `translateX(${a.offsetLeft - 4}px)`;
    shl.offsetWidth; shl.style.transition = '';
    list.querySelectorAll('.entry-row').forEach(r => r.remove());
    list.insertAdjacentHTML('beforeend', ed.entries.map((e, i) => {
      const base = `${edition}/${e.v}/`;
      return `<div class="entry-row in" style="--i:${i}">
        <span><b>${esc(e.v)}</b> <span class="v">· ${date(e.date)}</span></span>
        <span class="links"><a class="btn" href="${base}">This update</a><a class="btn" href="${base}since-release/">Since ${esc(ed.release)}</a></span>
        <span class="v">${esc(e.title)}</span>
      </div>`;
    }).join(''));
    list.querySelectorAll('.entry-row').forEach(r => r.onmouseenter = () => {
      hl.style.setProperty('--row-h', r.offsetHeight + 'px');
      hl.style.transform = `translateY(${r.offsetTop}px)`;
    });
  };
  const fromHash = () => SNAPSHOTS[location.hash.slice(1)] ? location.hash.slice(1) : 'java';
  show(fromHash(), true);
  addEventListener('hashchange', () => show(fromHash()));
  addEventListener('resize', () => {
    const a = seg.querySelector('[aria-current]');
    shl.style.width = a.offsetWidth + 'px'; shl.style.transform = `translateX(${a.offsetLeft - 4}px)`;
  });
})();
</script>
</body>
</html>
