<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WASD · Minecraft Java tools</title>
<meta name="description" content="Tools for Minecraft Java Edition: snapshot breakdowns, block color tools, world helpers and game mechanics.">
<link rel="stylesheet" href="shared/shell.css">
<style>
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .top .name { font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
  .top .ver { margin-left: auto; font: 13px var(--mono); color: var(--muted); }

  /* Featured card: the latest snapshot (or newest tool until snapshots exist). */
  .latest { overflow: hidden; padding: 0; }
  .strip { display: flex; height: 10px; }
  .strip i {
    flex: 1; background: var(--b); box-shadow: 1px 0 0 var(--b); /* hides subpixel seams */
    transform-origin: top; animation: drop .5s var(--spring) both; animation-delay: calc(300ms + var(--k) * 45ms);
  }
  @keyframes drop { from { transform: scaleY(0); } }
  .latest .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 24px 0; font: 500 13px var(--mono); color: var(--muted); }
  .latest .meta .date { margin-left: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text);
  }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
  .latest .body { padding: 14px 24px 8px; }
  .latest h1 { font-size: clamp(30px, 4.6vw, 44px); line-height: 1.08; letter-spacing: -.025em; font-weight: 700; max-width: 22ch; }
  .latest .sum { margin: 12px 0 0; color: var(--muted); max-width: 58ch; }
  .changes { list-style: none; margin: 20px 0 0; padding: 0; }
  .changes li { display: grid; grid-template-columns: 84px 1fr auto; gap: 16px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--panel-border); }
  .changes .kind, .changes code { font: 12px var(--mono); color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 24px 24px; }
  .actions .btn { display: inline-flex; gap: 8px; padding: 0 18px; }

  footer { margin-top: 44px; color: var(--faint); font: 12px var(--mono); }

  @media (max-width: 640px) {
    .changes li { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body data-tool="home">
<main>
  <div class="top">
    <span class="logo" role="img" aria-label="WASD"><b>W</b><b>A</b><b>S</b><b>D</b></span>
    <span class="name">WASD</span>
    <span class="ver" id="ver"></span>
  </div>

  <article class="panel latest in" style="--i:1" aria-labelledby="latest-h">
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="meta" id="latest-meta"></div>
    <div class="body">
      <h1 id="latest-h"></h1>
      <p class="sum" id="latest-sum"></p>
      <ul class="changes" id="latest-changes" hidden></ul>
    </div>
    <div class="actions" id="latest-actions"></div>
  </article>

  <div data-all-tools></div>

  <footer>Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.</footer>
</main>
<script src="shared/shell.js"></script>
<script>
  // Featured card. Once snapshot pages exist this becomes the newest one:
  // { label: 'Latest snapshot', version, date, title, summary, changes: [[kind, text, key]], link, cta }
  // strip: average colors (blocks.json) of the featured block's family; its last color is --seed in shell.css.
  const latest = {
    label: 'Latest snapshot', version: '26.4-snapshot-8', date: 'Nov 10, 2026',
    title: 'Frostbite, Ice Caves and a stack of new ice blocks',
    summary: 'Since 26.3 the theme is winter: a new icy mob, a cave biome, a throwable ice ball and full sets of calcite, packed ice and snow bricks.',
    changes: [
      ['mob', 'Frostbite, a new zombie that burns in daylight', 'frostbite'],
      ['biome', 'Ice Caves, a new underground biome', 'ice_caves'],
      ['blocks', 'Icicles, brittle ice, ice crystals and building sets', 'icicle'],
    ],
    link: 'snapshots/java/26.4-snapshot-8/since-release/', cta: 'Read the breakdown',
    strip: ['#f9fefe', '#8fb4fb', '#75a8fd'], // snow block, packed ice, blue ice
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
  $('ver').textContent = latest.version;
  $('latest-meta').innerHTML = `<span class="pill">${esc(latest.label)}</span>`
    + (latest.date ? `<span class="date">${esc(latest.date)}</span>` : '');
  $('latest-h').textContent = latest.title;
  $('latest-sum').textContent = latest.summary;
  if (latest.changes?.length) {
    $('latest-changes').hidden = false;
    $('latest-changes').innerHTML = latest.changes.map(([k, t, key]) =>
      `<li><span class="kind">${esc(k)}</span><span>${esc(t)}</span><code>${esc(key)}</code></li>`).join('');
  }
  $('latest-actions').innerHTML = `<a class="btn primary" href="${WASD.root}${latest.link}">${esc(latest.cta)} <span class="arr">→</span></a>`;

  // Strip: 16 cells blended in OKLab across the given colors, dropping in one by one.
  const n = latest.strip.length - 1;
  $('strip').innerHTML = Array.from({ length: 16 }, (_, k) => {
    const t = k / 15 * n, i = Math.min(n - 1, Math.floor(t)), f = Math.round((t - i) * 100);
    return `<i style="--b:color-mix(in oklab, ${latest.strip[i]} ${100 - f}%, ${latest.strip[i + 1]});--k:${k}"></i>`;
  }).join('');

</script>
</body>
</html>
